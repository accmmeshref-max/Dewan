<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#14202e;--mut:#5b6877;--line:#dde3ea;--navy:#0d1b2a;--gold:#c8a45c;--gold-d:#8a6a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a121c;--card:#132133;--tx:#eef1f5;--mut:#9aa8b8;--line:#22344a;--gold-d:#d8b56a}}

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif}
h1,h2{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.35;margin:0}
a{color:inherit}.w{max-width:860px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff}
header .w{display:flex;align-items:center;gap:12px;height:60px;max-width:1080px}
header img{width:40px;height:40px;border-radius:50%}header b{font:700 18px "Reem Kufi",sans-serif;margin-inline-end:auto}
.btn{display:inline-block;background:var(--gold);color:#1a1405;font-weight:600;padding:8px 18px;border-radius:8px;text-decoration:none}
a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding:40px 0 70px}h1{font-size:clamp(26px,4vw,38px)}.sub{color:var(--mut);margin:6px 0 28px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.c:target{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
h2{font-size:20px}.c ul{margin:8px 0 12px;padding-inline-start:22px}.c li{margin:2px 0}
.c a.q{color:var(--gold-d);font-weight:500;font-size:15px}
.note{border-inline-start:4px solid var(--gold);background:var(--card);padding:10px 16px;border-radius:8px;color:var(--mut);font-size:15px;margin-bottom:22px}
.wa{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:99px;padding:12px 18px;font-weight:600;text-decoration:none;box-shadow:0 4px 14px #0004}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<main><div class="w"><h1>المستندات المطلوبة لكل خدمة</h1>
<p class="sub">جهّز المستندات قبل التواصل لتسريع إنهاء طلبك.</p>
<div class="note">قد تختلف المتطلبات بحسب الجهة وطبيعة النشاط والشكل القانوني، فتواصل معنا قبل التقديم للتأكد من القائمة الخاصة بحالتك.</div>
